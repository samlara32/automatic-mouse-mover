name: Build & Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Build Universal macOS Application & DMG
        run: |
          make package
          cd bin
          zip -r amm.app.zip amm.app

      - name: Upload Build Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Universal-Build
          path: |
            bin/AutomaticMouseMover.dmg
            bin/amm.app.zip

      # Automated Release: If pushed with a version tag (e.g. v1.5.0)
      - name: Publish Tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/AutomaticMouseMover.dmg
            bin/amm.app.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Automated Rolling Release: If pushed to master branch directly
      - name: Publish / Update Latest Rolling Release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build (Automatic)"
          body: |
            ### 🚀 Automated Latest Build
            This release is automatically updated with each successful commit to the `master` branch.
            
            **Includes Universal macOS Binary (`arm64` + `x86_64`) compatible with Apple Silicon and Intel.**
            
            - **Commit:** ${{ github.sha }}
            - **Date:** ${{ github.event.head_commit.timestamp }}
          files: |
            bin/AutomaticMouseMover.dmg
            bin/amm.app.zip
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
