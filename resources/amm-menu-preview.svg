<svg width="680" height="460" viewBox="0 0 680 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Window shadow -->
    <filter id="shadow" x="0" y="0" width="680" height="460" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <feStop offset="0%" stop-color="#24262B" stop-opacity="0.96"/>
      <feStop offset="100%" stop-color="#1A1C20" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="blueActive" x1="0%" y1="0%" x2="100%" y2="0%">
      <feStop offset="0%" stop-color="#0A84FF"/>
      <feStop offset="100%" stop-color="#0066DF"/>
    </linearGradient>
  </defs>

  <!-- macOS Top Menu Bar Mockup Strip -->
  <rect x="20" y="15" width="640" height="34" rx="8" fill="#1C1E22" stroke="#33373E" stroke-width="1"/>
  <!-- Status Icons Mockup -->
  <circle cx="560" cy="32" r="3.5" fill="#8E95A2"/>
  <rect x="580" y="27" width="14" height="10" rx="2" fill="none" stroke="#8E95A2" stroke-width="1.5"/>
  <text x="605" y="36" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, sans-serif" font-size="12" font-weight="500" fill="#E1E4EA">9:41 AM</text>
  
  <!-- Active AMM Menu Bar Icon Highlight -->
  <rect x="490" y="19" width="38" height="26" rx="5" fill="#0A84FF" fill-opacity="0.25" stroke="#0A84FF" stroke-width="1"/>
  <path d="M504 26 C504 24 506 22 509 22 C512 22 514 24 514 26 L514 31 C514 34 512 36 509 36 C506 36 504 34 504 31 Z M509 22 L509 27 M504 27 L514 27" stroke="#0A84FF" stroke-width="1.4" stroke-linecap="round" fill="none"/>

  <!-- AMM Dropdown Menu Panel -->
  <g filter="url(#shadow)">
    <rect x="360" y="55" width="280" height="380" rx="10" fill="url(#bgGrad)" stroke="#434854" stroke-width="1"/>
  </g>

  <!-- Menu Items Content -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, sans-serif" font-size="13" fill="#F0F2F6">
    <!-- Header -->
    <text x="382" y="82" font-weight="600" fill="#FFFFFF">About Automatic Mouse Mover</text>
    
    <!-- Separator -->
    <line x1="372" y1="96" x2="628" y2="96" stroke="#363A44" stroke-width="1"/>
    
    <!-- Controls -->
    <text x="382" y="122" font-weight="400" fill="#8E95A2">Start</text>
    <rect x="372" y="134" width="256" height="26" rx="5" fill="url(#blueActive)"/>
    <text x="382" y="152" font-weight="600" fill="#FFFFFF">Stop</text>
    <circle cx="612" cy="147" r="3.5" fill="#68D391"/>

    <!-- Separator -->
    <line x1="372" y1="172" x2="628" y2="172" stroke="#363A44" stroke-width="1"/>

    <!-- Interval Submenu Item -->
    <text x="382" y="198" font-weight="500">Interval</text>
    <text x="560" y="198" font-size="12" fill="#8E95A2">1 Min</text>
    <path d="M618 193 L623 196.5 L618 200" stroke="#8E95A2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Movement Mode Submenu Item -->
    <text x="382" y="232" font-weight="500">Movement Mode</text>
    <text x="542" y="232" font-size="12" fill="#8E95A2">Micro (1px)</text>
    <path d="M618 227 L623 230.5 L618 234" stroke="#8E95A2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Auto-Stop Timer Submenu Item -->
    <text x="382" y="266" font-weight="500">Auto-Stop Timer</text>
    <text x="532" y="266" font-size="12" fill="#8E95A2">Continuous</text>
    <path d="M618 261 L623 264.5 L618 268" stroke="#8E95A2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Separator -->
    <line x1="372" y1="282" x2="628" y2="282" stroke="#363A44" stroke-width="1"/>

    <!-- Icon Submenu Item -->
    <text x="382" y="308" font-weight="500">Icon</text>
    <text x="565" y="308" font-size="12" fill="#8E95A2">Mouse</text>
    <path d="M618 303 L623 306.5 L618 310" stroke="#8E95A2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Icon Color Submenu Item -->
    <text x="382" y="342" font-weight="500">Icon Color</text>
    <circle cx="578" cy="338" r="4" fill="#0A84FF"/>
    <text x="588" y="342" font-size="12" fill="#8E95A2">Blue</text>
    <path d="M618 337 L623 340.5 L618 344" stroke="#8E95A2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Separator -->
    <line x1="372" y1="358" x2="628" y2="358" stroke="#363A44" stroke-width="1"/>

    <!-- Quit Item -->
    <text x="382" y="386" font-weight="400" fill="#FF453A">Quit Automatic Mouse Mover</text>
    <text x="608" y="386" font-size="11" fill="#8E95A2">⌘Q</text>
  </g>

  <!-- Left Side: Expanded Flyout Features Breakdown -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="270" height="270" rx="10" fill="#1E2025" stroke="#3B404B" stroke-width="1"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, sans-serif">
    <text x="70" y="140" font-size="12" font-weight="700" fill="#0A84FF" letter-spacing="0.5">SUBMENU PREVIEW: INTERVALS</text>
    
    <g font-size="13" fill="#F0F2F6">
      <text x="96" y="174">30 Seconds</text>
      
      <!-- Checked Item 1 Minute -->
      <rect x="62" y="188" width="246" height="28" rx="5" fill="#292D35"/>
      <path d="M76 202 L80 206 L89 196" stroke="#0A84FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="96" y="207" font-weight="600" fill="#FFFFFF">1 Minute (Default)</text>

      <text x="96" y="240">2 Minutes</text>
      <text x="96" y="272">5 Minutes</text>
      <text x="96" y="304">10 Minutes</text>
    </g>

    <line x1="62" y1="324" x2="308" y2="324" stroke="#363A44" stroke-width="1"/>
    <text x="70" y="348" font-size="11" fill="#8E95A2">✓ Native macOS HIG Checkmarks</text>
    <text x="70" y="365" font-size="11" fill="#8E95A2">✓ Dynamic Dark &amp; Light Mode</text>
  </g>
</svg>
